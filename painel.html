<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Chamada - Sala de Espera</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; background: #020617; color: #f8fafc;
      height: 100vh; display: flex; flex-direction: column; padding: 24px;
      gap: 20px; overflow: hidden;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid #1e293b; padding-bottom: 12px;
    }
    header h1 { margin: 0; font-size: 1.6rem; color: #38bdf8; letter-spacing: 0.5px; }
    .btn-som {
      background: #1e293b; color: #f8fafc; border: 1px solid #38bdf8;
      padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600;
    }
    .destaque {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border: 3px solid #38bdf8; border-radius: 20px; padding: 30px 32px;
      text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
    }
    .destaque.piscar {
      background: #0369a1; border-color: #fde047; transform: scale(1.01);
    }
    .destaque-tag {
      display: inline-block; background: #38bdf8; color: #020617;
      font-weight: 800; padding: 6px 18px; border-radius: 999px;
      font-size: 1.15rem; text-transform: uppercase; margin-bottom: 12px;
    }
    .destaque-nome {
      font-size: clamp(2.4rem, 4.8vw, 4.4rem); font-weight: 900;
      margin: 8px 0; color: #ffffff; line-height: 1.1;
    }
    .destaque-atendente {
      font-size: clamp(1.35rem, 2.3vw, 2rem); font-weight: 700; color: #fde047; margin-top: 8px;
    }
    .grid-listas {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px; flex: 1; align-content: start;
    }
    .card-lista {
      background: #0f172a; border: 1px solid #334155; border-radius: 16px;
      padding: 18px; display: flex; flex-direction: column; justify-content: space-between;
      min-height: 150px;
    }
    .card-cargo {
      font-size: 1.08rem; font-weight: 800; color: #38bdf8;
      border-bottom: 1px solid #1e293b; padding-bottom: 8px; margin-bottom: 10px;
      display: flex; justify-content: space-between;
    }
    .card-atual { font-size: 1.4rem; font-weight: 800; color: #fff; margin: 6px 0; }
    .card-atendente { font-size: 0.98rem; color: #fde047; font-weight: 700; }
    .card-proximo {
      margin-top: 12px; padding-top: 8px; border-top: 1px dashed #334155;
      font-size: 0.9rem; color: #94a3b8;
    }
  </style>
</head>
<body>
  <header>
    <h1>ATRIBUIÇÃO DE AULAS • COMPLETA JORNADA</h1>
    <button class="btn-som" id="btnSom" onclick="ativarSom()">Ativar Som</button>
  </header>

  <section class="destaque" id="boxDestaque">
    <div class="destaque-tag" id="destaqueCargo">AGUARDANDO CHAMADA</div>
    <div class="destaque-nome" id="destaqueNome">—</div>
    <div class="destaque-atendente" id="destaqueAtendente">Fique atento ao painel</div>
  </section>

  <section class="grid-listas" id="gridListas"></section>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyxBYfub-1kBUYrSyzELTTHtZzcgZN6FpLOBMwDSavQaRic3PS-ByPxwpJrf2kvb9rz/exec";

    let ultimoCallId = null;
    let primeiraCarga = true;
    let somAtivo = false;
    let audioCtx = null;

    // Fila sequencial para nunca cortar uma fala pela outra
    const filaFala = [];
    let falandoAgora = false;

    function ativarSom() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      somAtivo = true;
      const btn = document.getElementById('btnSom');
      btn.textContent = 'Som Ativado';
      btn.style.background = '#16a34a';
      tocarCampainha();
      enfileirarFala('Som ativado.');
    }

    function tocarCampainha() {
      if (!somAtivo || !audioCtx) return;
      const agora = audioCtx.currentTime;
      [660, 523.25].forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, agora + idx * 0.25);
        gain.gain.setValueAtTime(0.3, agora + idx * 0.25);
        gain.gain.exponentialRampToValueAtTime(0.001, agora + idx * 0.25 + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(agora + idx * 0.25);
        osc.stop(agora + idx * 0.25 + 0.6);
      });
    }

    function primeiroEUltimoNome(nomeCompleto) {
      if (!nomeCompleto) return '';
      const partes = String(nomeCompleto).trim().split(/\s+/).filter(Boolean);
      if (partes.length === 0) return '';
      if (partes.length === 1) return partes[0];
      return `${partes[0]} ${partes[partes.length - 1]}`;
    }

    function processarProximaFala() {
      if (!somAtivo || !('speechSynthesis' in window)) {
        filaFala.length = 0;
        falandoAgora = false;
        return;
      }
      if (falandoAgora || filaFala.length === 0) return;

      falandoAgora = true;
      const texto = filaFala.shift();

      try {
        const utter = new SpeechSynthesisUtterance(texto);
        utter.lang = 'pt-BR';
        utter.rate = 0.98;
        utter.pitch = 1;
        utter.volume = 1;

        const vozes = window.speechSynthesis.getVoices();
        const vozPt = vozes.find(v => v.lang && v.lang.toLowerCase().startsWith('pt'));
        if (vozPt) utter.voice = vozPt;

        utter.onend = () => {
          falandoAgora = false;
          setTimeout(processarProximaFala, 350);
        };
        utter.onerror = () => {
          falandoAgora = false;
          setTimeout(processarProximaFala, 350);
        };

        window.speechSynthesis.speak(utter);
      } catch (e) {
        falandoAgora = false;
        setTimeout(processarProximaFala, 350);
      }
    }

    function enfileirarFala(texto) {
      if (!somAtivo || !texto) return;
      filaFala.push(texto);
      processarProximaFala();
    }

    function anunciarChamada(chamada) {
      if (!somAtivo) return;
      const nomeCurto = primeiroEUltimoNome(chamada.nome);
      const cargo = chamada.cargo ? `cargo ${chamada.cargo}` : '';
      const partesFrase = ['Atenção', nomeCurto, cargo].filter(Boolean);
      const frase = `${partesFrase.join(', ')}.`;
      setTimeout(() => enfileirarFala(frase), 500);
    }

    function montarUrlStatus() {
      const url = new URL(API_URL);
      url.searchParams.set('modulo', 'chamada');
      url.searchParams.set('action', 'status');
      return url.toString();
    }

    async function atualizarPainel() {
      try {
        const res = await fetch(montarUrlStatus());
        const data = await res.json();
        if (!data.ok) return;

        if (!data.ultimaChamada && (!data.listas || data.listas.every(l => !l.atual))) {
          document.getElementById('destaqueCargo').textContent = 'AGUARDANDO CHAMADA';
          document.getElementById('destaqueNome').textContent = '—';
          document.getElementById('destaqueAtendente').textContent = 'Fique atento ao painel';
          ultimoCallId = null;
          primeiraCarga = false;
        } else if (data.ultimaChamada) {
          const u = data.ultimaChamada;
          const responsavel = u.atendente || u.mesa || '';
          document.getElementById('destaqueCargo').textContent = u.cargo;
          document.getElementById('destaqueNome').textContent = u.nome;
          document.getElementById('destaqueAtendente').textContent =
            responsavel ? `Atendente: ${responsavel}` : '';

          if (!primeiraCarga && ultimoCallId !== u.callId) {
            tocarCampainha();
            anunciarChamada(u);
            const box = document.getElementById('boxDestaque');
            box.classList.add('piscar');
            setTimeout(() => box.classList.remove('piscar'), 2500);
          }
          ultimoCallId = u.callId;
          primeiraCarga = false;
        } else {
          primeiraCarga = false;
        }

        const grid = document.getElementById('gridListas');
        grid.innerHTML = '';
        (data.listas || []).forEach(lista => {
          const responsavelLista = lista.atendente || lista.mesa || '';
          const card = document.createElement('div');
          card.className = 'card-lista';
          card.innerHTML = `
            <div>
              <div class="card-cargo">
                <span>${lista.cargo}</span>
                <span>${lista.indiceAtual}/${lista.total}</span>
              </div>
              <div class="card-atual">${lista.atual || 'Aguardando'}</div>
              <div class="card-atendente">${lista.atual && responsavelLista ? `Atendente: ${responsavelLista}` : ''}</div>
            </div>
            <div class="card-proximo">
              Próximo: <strong>${lista.proximo || 'Fim da lista'}</strong>
            </div>
          `;
          grid.appendChild(card);
        });
      } catch (e) {
        console.error('Erro ao atualizar painel:', e);
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
    }

    atualizarPainel();
    setInterval(atualizarPainel, 2500);
  </script>
</body>
</html>
